name: Build V10 Scoped Android

on:
  push:
    branches: [experimental/v10-scoped]

permissions:
  contents: read
  statuses: write

concurrency:
  group: v10-scoped-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VCPKG_ROOT: /usr/local/share/vcpkg
    steps:
      - name: Report run to commit status
        env:
          GH_JOB_TOKEN: ${{ github.token }}
        run: |
          jq -n --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:"pending",context:"V10 Scoped Android",target_url:$url}' |
            curl --silent --show-error --fail -o /dev/null -H "Authorization: Bearer $GH_JOB_TOKEN" \
              -H 'Content-Type: application/json' --data-binary @- \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Prepare native and Android dependencies
        run: bash ./.ci/setup-android.sh

      - name: Build experimental Android APK
        run: bash ./.ci/build-android.sh artifacts/v10-scoped

      - name: Verify package, signature, architecture and storage declarations
        shell: bash
        run: |
          set -euo pipefail
          dir=artifacts/v10-scoped
          apk="$dir/app.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose --print-certs --min-sdk-version 32 --max-sdk-version 32 "$apk" | tee "$dir/signature.txt"
          test "$(grep -Ec '^Signer #[0-9]+ certificate SHA-256 digest: [0-9a-fA-F]{64}$' "$dir/signature.txt")" -eq 1
          "$tools/aapt2" dump badging "$apk" > "$dir/badging.txt"
          "$tools/aapt2" dump xmltree "$apk" --file AndroidManifest.xml > "$dir/manifest.txt"
          grep -Eq "^package: name='org\.vita3kplus\.emulator\.debug\.v10scopedmklab'" "$dir/badging.txt"
          grep -Eq "^native-code: 'arm64-v8a'[[:space:]]*$" "$dir/badging.txt"
          grep -Eq '^[[:space:]]*E: manifest([[:space:]]|$)' "$dir/manifest.txt"
          min_sdk=$(sed -nE "s/^(minSdkVersion|sdkVersion):'([0-9]+)'.*/\2/p" "$dir/badging.txt")
          [[ "$min_sdk" =~ ^[0-9]+$ && "$min_sdk" -ge 1 && "$min_sdk" -le 32 ]]
          if grep -Ei 'sharedUserId|MANAGE_EXTERNAL_STORAGE|REQUEST_INSTALL_PACKAGES|requestLegacyExternalStorage|android\.permission\.(READ|WRITE)_EXTERNAL_STORAGE' "$dir/manifest.txt"; then
            echo 'The APK declares disallowed storage or installation access.' >&2
            exit 1
          fi
          (cd "$dir" && sha256sum app.apk > SHA256SUMS)
          cat "$dir/SHA256SUMS"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Vita3K-V10-Scoped-Android
          path: artifacts/v10-scoped/
          if-no-files-found: error
          retention-days: 14

      - name: Report final verification to commit status
        if: always()
        env:
          GH_JOB_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [ "$BUILD_STATUS" = success ]; then state=success; fi
          jq -n --arg state "$state" --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:"V10 Scoped Android",target_url:$url}' |
            curl --silent --show-error --fail -o /dev/null -H "Authorization: Bearer $GH_JOB_TOKEN" \
              -H 'Content-Type: application/json' --data-binary @- \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
