name: Experimental Mali APK

on:
  workflow_dispatch:
  push:
    branches:
      - mali-v2-upstream
      - mali-v3-snapshots
      - mali-v4-diagnostics
      - mali-v5-vertex-diagnostics
      - mali-v6-index-uniform-diagnostics
      - mali-v61-uniform-measurement
      - mali-v8-rgb16-padding
      - mali-v9-rgb16-staging
      - mali-v9-mk9-parallel

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out emulator and native dependencies
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache native dependencies
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/share/vcpkg/installed
            /usr/local/share/vcpkg/packages
          key: mali-apk-native-${{ hashFiles('CMakeLists.txt', 'cmake/**', '.ci/setup-android.sh', 'vcpkg.json') }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android and native build dependencies
        env:
          VCPKG_ROOT: /usr/local/share/vcpkg
        run: bash ./.ci/setup-android.sh

      - name: Build experimental APK
        env:
          VCPKG_ROOT: /usr/local/share/vcpkg
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: bash ./.ci/build-android.sh artifacts/mali-test

      - name: Verify parallel MK9 APK
        if: github.ref_name == 'mali-v9-mk9-parallel'
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          apk=artifacts/mali-test/app.apk
          package=org.vita3kplus.emulator.debug.v9test
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          test "$("$tools/aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")" = "$package"
          "$tools/aapt" dump badging "$apk" | tee /tmp/mk9-badging.txt
          grep -F "native-code: 'arm64-v8a'" /tmp/mk9-badging.txt
          "$tools/aapt" dump xmltree "$apk" AndroidManifest.xml | tee /tmp/mk9-manifest.txt
          awk '/android:authorities/ { seen++; if (index($0, "=\"org.vita3kplus.emulator.debug.v9test.") == 0) bad=1 } END { exit (bad || !seen) }' /tmp/mk9-manifest.txt
          grep -F "$package.documents" /tmp/mk9-manifest.txt
          grep 'android:allowBackup' /tmp/mk9-manifest.txt | grep -F '0x0'
          if grep -q 'android:sharedUserId' /tmp/mk9-manifest.txt; then exit 1; fi
          unzip -p "$apk" lib/arm64-v8a/libVita3K.so > /tmp/mk9-vita3k.so
          grep -aFq '[MALI-V9-RGB16]' /tmp/mk9-vita3k.so
          sha256sum "$apk" | tee artifacts/mali-test/SHA256SUMS.txt

      - name: Upload parallel MK9 APK
        if: github.ref_name == 'mali-v9-mk9-parallel'
        uses: actions/upload-artifact@v7
        with:
          name: Vita3K-MK9-V9-parallel
          path: artifacts/mali-test/
          if-no-files-found: error

      - name: Upload unsigned-for-release, debug-signed APK
        if: github.ref_name != 'mali-v9-mk9-parallel'
        uses: actions/upload-artifact@v7
        with:
          name: vita3k-mali-v9-rgb16-staging-apk
          path: artifacts/mali-test/app.apk
          if-no-files-found: error
